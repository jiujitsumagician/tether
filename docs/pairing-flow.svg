<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">
  <style>
    .node { fill: #1d2330; stroke: #6c8cff; stroke-width: 1.5; rx: 12; }
    .node-text { fill: #f4f5f7; }
    .terminal { fill: #0d3b22; stroke: #4ade80; }
    .fail { fill: #2f1414; stroke: #f87171; }
    .label { fill: #98a2b8; font-size: 11px; }
    .timeout { fill: #f6c177; font-size: 10px; font-weight: 600; }
    .arrow { stroke: #6c8cff; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrow-yes { stroke: #4ade80; stroke-width: 1.5; fill: none; marker-end: url(#arrowGreen); }
    .arrow-fail { stroke: #f87171; stroke-width: 1.5; fill: none; marker-end: url(#arrowRed); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8cff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="920" height="640" fill="#0c0e14"/>

  <!-- Phase 1 -->
  <rect x="40" y="40" width="200" height="60" class="node"/>
  <text x="140" y="65" class="node-text" text-anchor="middle" font-weight="600">1 · mDNS discovery</text>
  <text x="140" y="84" class="label" text-anchor="middle">_tether._tcp.local.</text>
  <text x="248" y="58" class="timeout">5 s timeout</text>

  <!-- Phase 2 -->
  <rect x="40" y="160" width="200" height="60" class="node"/>
  <text x="140" y="185" class="node-text" text-anchor="middle" font-weight="600">2 · UDP broadcast</text>
  <text x="140" y="204" class="label" text-anchor="middle">255.255.255.255:31413</text>
  <text x="248" y="178" class="timeout">3 s timeout</text>

  <!-- Phase 3 -->
  <rect x="40" y="280" width="200" height="60" class="node"/>
  <text x="140" y="305" class="node-text" text-anchor="middle" font-weight="600">3 · Subnet probe</text>
  <text x="140" y="324" class="label" text-anchor="middle">unicast /24 sweep</text>
  <text x="248" y="298" class="timeout">2 s timeout</text>

  <!-- Phase 4 -->
  <rect x="40" y="400" width="200" height="60" class="node"/>
  <text x="140" y="425" class="node-text" text-anchor="middle" font-weight="600">4 · USB / ADB</text>
  <text x="140" y="444" class="label" text-anchor="middle">"Connect your phone…"</text>

  <!-- Phase 5 / 6 -->
  <rect x="40" y="520" width="200" height="50" class="node"/>
  <text x="140" y="540" class="node-text" text-anchor="middle" font-weight="600">5 · Hotspot prompt</text>
  <text x="140" y="558" class="label" text-anchor="middle">(opt-in)</text>

  <rect x="40" y="585" width="200" height="40" class="node"/>
  <text x="140" y="610" class="node-text" text-anchor="middle">6 · Manual entry (escape hatch)</text>

  <!-- Right column: post-discovery sequence -->
  <rect x="560" y="40" width="320" height="60" class="node"/>
  <text x="720" y="65" class="node-text" text-anchor="middle" font-weight="600">TLS 1.3 handshake</text>
  <text x="720" y="84" class="label" text-anchor="middle">self-signed, cert SHA-256 captured</text>

  <rect x="560" y="160" width="320" height="60" class="node"/>
  <text x="720" y="185" class="node-text" text-anchor="middle" font-weight="600">WebSocket upgrade + hello</text>
  <text x="720" y="204" class="label" text-anchor="middle">X25519 pubkey + own cert SHA-256</text>

  <rect x="560" y="280" width="320" height="60" class="node"/>
  <text x="720" y="305" class="node-text" text-anchor="middle" font-weight="600">verify</text>
  <text x="720" y="324" class="label" text-anchor="middle">HKDF-SHA256(shared,"tether/verify/v1",16) → 3 emoji</text>

  <rect x="560" y="400" width="320" height="60" class="node"/>
  <text x="720" y="425" class="node-text" text-anchor="middle" font-weight="600">User taps Confirm on both</text>
  <text x="720" y="444" class="label" text-anchor="middle">60 s timeout · mismatch closes</text>

  <rect x="560" y="520" width="320" height="60" class="node terminal"/>
  <text x="720" y="545" class="node-text" text-anchor="middle" font-weight="600">Paired — cert fingerprint pinned</text>
  <text x="720" y="564" class="label" text-anchor="middle">stored on both sides; auto-reconnect on launch</text>

  <!-- Arrows down the left column (failure / fallthrough) -->
  <path d="M140,100 L140,160" class="arrow-fail"/>
  <path d="M140,220 L140,280" class="arrow-fail"/>
  <path d="M140,340 L140,400" class="arrow-fail"/>
  <path d="M140,460 L140,520" class="arrow-fail"/>
  <path d="M140,570 L140,585" class="arrow-fail"/>

  <!-- Arrows from each phase to TLS box -->
  <path d="M240,70 C400,70 400,70 560,70" class="arrow-yes"/>
  <path d="M240,190 C400,190 480,70 558,70" class="arrow-yes"/>
  <path d="M240,310 C400,310 480,70 558,70" class="arrow-yes"/>
  <path d="M240,430 C400,430 480,70 558,70" class="arrow-yes"/>
  <path d="M240,545 C400,545 480,70 558,70" class="arrow-yes"/>
  <path d="M240,605 C400,605 480,70 558,70" class="arrow-yes"/>

  <!-- Vertical chain inside the post-discovery sequence -->
  <path d="M720,100 L720,160" class="arrow"/>
  <path d="M720,220 L720,280" class="arrow"/>
  <path d="M720,340 L720,400" class="arrow"/>
  <path d="M720,460 L720,520" class="arrow"/>

  <!-- Legend -->
  <g transform="translate(40,15)">
    <text class="label">phase fall-through (timeout / blocked)</text>
    <line x1="220" y1="-3" x2="260" y2="-3" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <g transform="translate(340,15)">
    <text class="label">peer found → handshake</text>
    <line x1="150" y1="-3" x2="190" y2="-3" stroke="#4ade80" stroke-width="1.5"/>
  </g>
</svg>
