[package]
name = "tether-desktop"
version = "0.1.0"
description = "Tether — Android↔PC pairing made bulletproof"
authors = ["DickSoft Industries"]
edition = "2021"
rust-version = "1.75"

# Build the binary as a Tauri app. Library crate so unit tests can
# pull in pairing / handshake / emoji modules without spinning up the
# webview.
[lib]
name = "tether_core"
path = "src/lib.rs"

[[bin]]
name = "tether-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process"] }
futures-util = "0.3"

# Discovery
mdns-sd = "0.11"
ipnetwork = "0.20"
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["net"] }

# Transport
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["std"] }
rustls-pemfile = "2"
rcgen = "0.13"
tungstenite = "0.24"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# Crypto
x25519-dalek = { version = "2", features = ["serde", "static_secrets", "getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
serde_json = "1"

# Storage
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "1"
anyhow = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
