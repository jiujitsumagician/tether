[package]
name = "tether-desktop"
version = "0.1.2"
description = "Tether — Android↔PC pairing made bulletproof"
authors = ["DickSoft Industries"]
edition = "2021"
rust-version = "1.75"

# Build the binary as a Tauri app. Library crate so unit tests can
# pull in pairing / handshake / emoji modules without spinning up the
# webview.
[lib]
name = "tether_core"
path = "src/lib.rs"

[[bin]]
name = "tether-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# Tauri is gated behind the `desktop` feature so the library + its
# unit tests can build without pulling the WebView2 toolchain. Default
# build (cargo build / cargo run) keeps `desktop` enabled so the bin
# target compiles normally.
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process", "fs"] }
futures-util = "0.3"

# Discovery
mdns-sd = "0.11"
ipnetwork = "0.20"
socket2 = { version = "0.5", features = ["all"] }

# Transport
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
tungstenite = "0.24"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# Crypto
x25519-dalek = { version = "2", features = ["serde", "static_secrets", "getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
serde_json = "1"

# Storage
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "1"
anyhow = "1"

# Unix-only — interface enumeration for the subnet probe.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["net"] }

[features]
# `desktop` pulls in the Tauri runtime + its build script. Disable
# (cargo test --lib --no-default-features) to run unit tests without
# the WebView2 / GTK toolchain dependency.
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-fs",
    "dep:tauri-build",
]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
